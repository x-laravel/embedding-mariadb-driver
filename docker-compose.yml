services:
  mariadb:
    image: mariadb:11.7
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: embedding_test
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  php83:
    build:
      context: .
      args:
        PHP_VERSION: "8.3"
    volumes:
      - .:/app
      - vendor83:/app/vendor
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=embedding_test
      - DB_USERNAME=root
      - DB_PASSWORD=password
    depends_on:
      mariadb:
        condition: service_healthy
    entrypoint: ["sh", "-c", "composer install --no-interaction && vendor/bin/phpunit"]
    profiles: ["php83"]

  php84:
    build:
      context: .
      args:
        PHP_VERSION: "8.4"
    volumes:
      - .:/app
      - vendor84:/app/vendor
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=embedding_test
      - DB_USERNAME=root
      - DB_PASSWORD=password
    depends_on:
      mariadb:
        condition: service_healthy
    entrypoint: ["sh", "-c", "composer install --no-interaction && vendor/bin/phpunit"]
    profiles: ["php84"]

  php85:
    build:
      context: .
      args:
        PHP_VERSION: "8.5"
    volumes:
      - .:/app
      - vendor85:/app/vendor
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=embedding_test
      - DB_USERNAME=root
      - DB_PASSWORD=password
    depends_on:
      mariadb:
        condition: service_healthy
    entrypoint: ["sh", "-c", "composer install --no-interaction && vendor/bin/phpunit"]
    profiles: ["php85"]

volumes:
  vendor83:
  vendor84:
  vendor85:
